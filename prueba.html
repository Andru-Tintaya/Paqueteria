<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner de Tickets Dual</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --bg: #f3f4f6;
            --text: #1f2937;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 1.35rem;
            text-align: center;
            margin: 5px 0 15px;
        }

        .camera-container {
            width: 100%;
            max-width: 430px;
            position: relative;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,.2);
        }

        video {
            width: 100%;
            height: auto;
            display: block;
        }

        .scan-guide {
            position: absolute;
            top: 5%;
            left: 7%;
            width: 86%;
            height: 90%;
            border: 3px solid #22c55e;
            border-radius: 10px;
            pointer-events: none;
        }

        .scan-guide::before {
            content: "CÓDIGO ARRIBA / DATOS ABAJO";
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            background: #16a34a;
            color: white;
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 10px;
            font-weight: bold;
            white-space: nowrap;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            width: 100%;
            max-width: 430px;
        }

        button {
            flex: 1;
            padding: 13px 10px;
            border: none;
            border-radius: 9px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            background: var(--primary);
            cursor: pointer;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        #btn-scan {
            background: var(--success);
        }

        #status {
            width: 100%;
            max-width: 430px;
            min-height: 45px;
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: .85rem;
            font-weight: bold;
            background: #fff7ed;
            color: #c2410c;
        }

        .form-container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,.1);
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: .8rem;
            font-weight: bold;
            margin-bottom: 4px;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 1rem;
            outline: none;
        }

        .codigo-box {
            border: 2px solid #22c55e;
            background: #f0fdf4;
        }

        .resultado {
            margin-top: 12px;
            padding: 10px;
            border-radius: 8px;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: .8rem;
            line-height: 1.4;
        }

        canvas {
            display: none;
        }
    </style>
</head>
<body>

    <h1>📷 Escáner de Tickets Dual</h1>
    
    <div class="camera-container">
        <video id="video" autoplay playsinline></video>
        <div class="scan-guide"></div>
    </div>
    
    <div class="controls">
        <button id="btn-start">📷 Abrir Cámara</button>
        <button id="btn-scan" disabled>🔎 Tomar Foto y Unificar</button>
    </div>
    
    <div id="status">
        Presiona "Abrir Cámara" y ubica el ticket dentro del recuadro.
    </div>
    
    <div class="form-container">
        <div class="form-group">
            <label for="codigo">Código PRINCIPAL</label>
            <input class="codigo-box" type="text" id="codigo" placeholder="Ej: A2, A6, A15">
        </div>
        <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" placeholder="Nombre completo">
        </div>
        <div class="form-group">
            <label for="celular">Celular</label>
            <input type="text" id="celular" placeholder="71234567">
        </div>
        <div class="form-group">
            <label for="detalle">Detalle</label>
            <input type="text" id="detalle" placeholder="ELECTRONICOS">
        </div>
        <div class="form-group">
            <label for="fecha">Fecha y Hora</label>
            <input type="text" id="fecha" placeholder="09/07/2026 14:30">
        </div>
        <div class="form-group">
            <label for="extra">Tienda / Lugar</label>
            <input type="text" id="extra" placeholder="MEDIA LUNA">
        </div>
        <div class="resultado" id="resultado">
            El escaneo procesará ambas zonas unificadas.
        </div>
    </div>

    <!-- Canales ocultos para procesamiento interno -->
    <canvas id="canvas-foto"></canvas>
    <canvas id="canvas-unificado"></canvas>

    <script>
        const video = document.getElementById("video");
        const canvasFoto = document.getElementById("canvas-foto");
        const canvasUnificado = document.getElementById("canvas-unificado");
        const btnStart = document.getElementById("btn-start");
        const btnScan = document.getElementById("btn-scan");
        const statusEl = document.getElementById("status");
        const resultadoEl = document.getElementById("resultado");
        let stream = null;

        btnStart.addEventListener("click", async () => {
            try {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: "environment" },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        focusMode: "continuous"
                    },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();
                btnScan.disabled = false;
                statusEl.innerText = "✅ Cámara lista. Presiona 'Tomar Foto y Unificar'.";
            } catch (error) {
                console.error(error);
                statusEl.innerText = "❌ No se pudo abrir la cámara.";
            }
        });

        btnScan.addEventListener("click", async () => {
            if (!stream) return;
            btnScan.disabled = true;

            try {
                statusEl.innerText = "📸 Tomando foto y procesando zonas...";

                const vW = video.videoWidth;
                const vH = video.videoHeight;
                canvasFoto.width = vW;
                canvasFoto.height = vH;
                const ctxFoto = canvasFoto.getContext("2d", { willReadFrequently: true });
                
                // 1. Capturar la foto real de la cámara
                ctxFoto.drawImage(video, 0, 0, vW, vH);

                statusEl.innerText = "⚙️ Normalizando letra gigante y unificando...";

                // 2. Partir la foto en 2 partes:
                // PARTE SUPERIOR (Donde está el código gigante, ej: A6)
                const altoSuperior = Math.floor(vH * 0.35);
                
                // PARTE INFERIOR (Donde están los datos pequeños: nombre, celular, etc.)
                const altoInferior = vH - altoSuperior;

                // Creamos un canvas temporal para la parte superior y la reducimos de tamaño 
                // para que la letra gigante se vuelva pequeña, del mismo tamaño que el texto inferior.
                const canvasTopReducido = document.createElement("canvas");
                const anchoReducido = vW; // Mismo ancho
                const altoTopReducido = Math.floor(altoSuperior * 0.35); // Reducimos drásticamente el alto (escala ~0.35)
                canvasTopReducido.width = anchoReducido;
                canvasTopReducido.height = altoTopReducido;
                const ctxTopRed = canvasTopReducido.getContext("2d");
                ctxTopRed.imageSmoothingEnabled = true;
                ctxTopRed.imageSmoothingQuality = "high";
                // Dibujamos el recorte superior achicándolo para que coincida en tamaño con las letras de abajo
                ctxTopRed.drawImage(canvasFoto, 0, 0, vW, altoSuperior, 0, 0, anchoReducido, altoTopReducido);

                // 3. Crear el lienzo unificado final donde ambas partes tienen letras proporcionales
                canvasUnificado.width = vW;
                canvasUnificado.height = altoTopReducido + altoInferior;
                const ctxUnif = canvasUnificado.getContext("2d", { willReadFrequently: true });
                
                // Fondo blanco de base
                ctxUnif.fillStyle = "#FFFFFF";
                ctxUnif.fillRect(0, 0, canvasUnificado.width, canvasUnificado.height);

                // Pegamos arriba el código gigante ya reducido de tamaño
                ctxUnif.drawImage(canvasTopReducido, 0, 0);
                
                // Pegamos abajo el resto del ticket con la letra pequeña original
                ctxUnif.drawImage(canvasFoto, 0, altoSuperior, vW, altoInferior, 0, altoTopReducido, vW, altoInferior);

                // 4. Mejorar la calidad de la imagen unificada completa (contraste fuerte B/N)
                mejorarCalidadImagen(canvasUnificado);

                statusEl.innerText = "🔎 Escaneando imagen unificada...";

                // 5. Escanear todo en conjunto de un solo golpe con Tesseract
                const resultado = await Tesseract.recognize(
                    canvasUnificado.toDataURL("image/jpeg", 0.95),
                    "spa+eng",
                    {
                        logger: mensaje => {
                            if (mensaje.status === "recognizing text") {
                                const porcentaje = Math.round(mensaje.progress * 100);
                                statusEl.innerText = `🔎 Leyendo ticket unificado: ${porcentaje}%`;
                            }
                        }
                    }
                );

                const textoCompleto = resultado.data.text;
                console.log("TEXTO UNIFICADO ESCANEADO:", textoCompleto);

                procesarResultados(textoCompleto);
                statusEl.innerText = "✅ ¡Escaneo completado con éxito!";

            } catch (error) {
                console.error(error);
                statusEl.innerText = "❌ Error al procesar la imagen. Intenta nuevamente.";
            } finally {
                btnScan.disabled = false;
            }
        });

        // Función para aplicar binarización y alto contraste nítido
        function mejorarCalidadImagen(canvas) {
            const ctx = canvas.getContext("2d", { willReadFrequently: true });
            const imagen = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imagen.data;
            
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                
                const gris = 0.299 * r + 0.587 * g + 0.114 * b;
                let valor = ((gris - 128) * 1.6) + 128;
                valor = valor > 140 ? 255 : 0; // Blanco o negro puro
                
                data[i] = data[i + 1] = data[i + 2] = valor;
            }
            ctx.putImageData(imagen, 0, 0);
        }

        function procesarResultados(texto) {
            let codigo = detectarCodigo(texto);
            let celular = detectarCelular(texto);
            let fecha = detectarFecha(texto);
            let detalle = detectarCampo(texto, ["detalle", "producto", "descripcion", "descripción"]);
            let nombre = detectarNombre(texto, codigo, celular, fecha, detalle);
            let extra = detectarExtra(texto);

            document.getElementById("codigo").value = codigo;
            document.getElementById("nombre").value = nombre;
            document.getElementById("celular").value = celular;
            document.getElementById("detalle").value = detalle;
            document.getElementById("fecha").value = fecha;
            document.getElementById("extra").value = extra;

            resultadoEl.innerHTML = `
                <strong>Resultado:</strong><br>
                Código: ${codigo || "No detectado"}<br>
                Nombre: ${nombre || "No detectado"}<br>
                Celular: ${celular || "No detectado"}<br>
                Detalle: ${detalle || "No detectado"}<br>
                Fecha: ${fecha || "No detectada"}<br>
                Tienda: ${extra || "No detectada"}
            `;
        }

        function detectarCodigo(texto) {
            const correccionesOCR = { 'G': '6', 'Z': '2', 'S': '5', 'O': '0', 'I': '1', 'L': '1', 'B': '8' };
            const match = texto.match(/\b([A-Z])\s*[-.]?\s*(\d{1,3})\b/gi);
            if (match && match.length) {
                for (const candidato of match) {
                    const limpio = candidato.replace(/[\s\-\.]/g, "").toUpperCase();
                    if (/^[A-Z]\d{1,3}$/.test(limpio)) return limpio;
                }
            }
            const lineas = texto.split("\n").map(l => l.trim()).filter(Boolean);
            for (const linea of lineas) {
                let limpia = linea.replace(/[^A-Za-z0-9]/g, "").toUpperCase();
                if (/^[A-Z][A-Z0-9]{1,3}$/.test(limpia)) {
                    const prefijo = limpia.charAt(0);
                    let numeros = "";
                    for (let char of limpia.substring(1)) {
                        numeros += correccionesOCR[char] || char;
                    }
                    const codigoFinal = prefijo + numeros;
                    if (/^[A-Z]\d{1,3}$/.test(codigoFinal)) return codigoFinal;
                }
            }
            return "";
        }

        function detectarCelular(texto) {
            const match = texto.match(/(?:\+591\s*)?\b[67]\d{7}\b/g);
            if (match && match.length) return match[0].replace(/\+591\s*/, "").trim();
            const fallback = texto.match(/\b\d{8}\b/g);
            if (fallback && fallback.length) return fallback[0];
            return "";
        }

        function detectarFecha(texto) {
            const patrones = [
                /\b\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4}\s+\d{1,2}:\d{2}\b/,
                /\b\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4}\b/
            ];
            for (const patron of patrones) {
                const match = texto.match(patron);
                if (match) return match[0];
            }
            return "";
        }

        function detectarCampo(texto, etiquetas) {
            const lineas = texto.split("\n").map(l => l.trim()).filter(Boolean);
            for (const linea of lineas) {
                for (const etiqueta of etiquetas) {
                    const regex = new RegExp("^" + etiqueta + "\\s*[:\\-]?\\s*(.+)$", "i");
                    const match = linea.match(regex);
                    if (match) return limpiarTexto(match[1]);
                }
            }
            return "";
        }

        function detectarNombre(texto, codigo, celular, fecha, detalle) {
            const lineas = texto.split("\n").map(l => limpiarTexto(l)).filter(Boolean);
            const descartadas = ["detalle", "producto", "descripcion", "nombre", "celular", "telefono", "fecha", "hora", "tienda", "media luna"];
            for (const linea of lineas) {
                const upper = linea.toUpperCase();
                if (codigo && upper.includes(codigo.toUpperCase())) continue;
                if (celular && linea.includes(celular)) continue;
                if (fecha && linea.includes(fecha)) continue;
                if (detalle && upper.includes(detalle.toUpperCase())) continue;
                if (descartadas.some(palabra => upper === palabra.toUpperCase())) continue;
                if ((linea.match(/\d/g) || []).length > linea.length / 2) continue;
                if (/^[A-Za-zÁÉÍÓÚáéíóúÑñÜü\s]+$/.test(linea) && linea.length >= 3) {
                    return linea;
                }
            }
            return "";
        }

        function detectarExtra(texto) {
            const lugares = ["MEDIA LUNA"];
            for (const lugar of lugares) {
                if (texto.toUpperCase().includes(lugar)) return lugar;
            }
            return "MEDIA LUNA";
        }

        function limpiarTexto(texto) {
            return texto
                .replace(/^[^A-Za-zÁÉÍÓÚáéíóúÑñÜü0-9]+/, "")
                .replace(/[^A-Za-zÁÉÍÓÚáéíóúÑñÜü0-9\s:\/\-.]+$/g, "",)
                .replace(/\s+/g, " ")
                .trim();
        }
    </script>
</body>
</html>

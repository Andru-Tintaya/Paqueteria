<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner de Tickets Pro Max</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f3f4f6;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            font-size: 1.4rem;
            text-align: center;
            margin-bottom: 15px;
            color: #1f2937;
        }
        .camera-container {
            width: 100%;
            max-width: 430px;
            position: relative;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        .scan-guide {
            position: absolute;
            top: 5%;
            left: 7%;
            width: 86%;
            height: 90%;
            border: 3px solid #22c55e;
            border-radius: 10px;
            pointer-events: none;
        }
        .scan-guide::before {
            content: "COLOCA TODO EL TICKET DENTRO";
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            background: #16a34a;
            color: white;
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 10px;
            font-weight: bold;
            white-space: nowrap;
        }
        .scan-guide::after {
            content: "CÓDIGO GIGANTE ARRIBA";
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 9px;
            white-space: nowrap;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            width: 100%;
            max-width: 430px;
        }
        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 9px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            background: #2563eb;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        #btn-scan {
            background: #16a34a;
        }
        #btn-scan:active {
            transform: scale(0.97);
        }
        #status {
            width: 100%;
            max-width: 430px;
            min-height: 45px;
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
            background: #fff7ed;
            color: #c2410c;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 5px;
        }
        .progress-bar-fill {
            height: 100%;
            background: #16a34a;
            width: 0%;
            transition: width 0.3s;
        }
        .form-container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 4px;
            color: #374151;
        }
        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
        }
        .codigo-box {
            border: 2px solid #22c55e;
            background: #f0fdf4;
        }
        .resultado {
            margin-top: 12px;
            padding: 10px;
            border-radius: 8px;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 0.8rem;
            line-height: 1.5;
        }
        .debug-container {
            margin-top: 15px;
            width: 100%;
            max-width: 430px;
            border-radius: 8px;
            overflow: hidden;
            background: #1f2937;
            padding: 10px;
        }
        .debug-container canvas {
            width: 100%;
            border-radius: 4px;
            display: none;
        }
        .debug-container .controls-debug {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            justify-content: center;
        }
        .debug-container .controls-debug button {
            padding: 5px 12px;
            font-size: 0.7rem;
            background: #4b5563;
            flex: 0 1 auto;
        }
        .stats {
            font-size: 0.7rem;
            color: #9ca3af;
            text-align: center;
            margin-top: 8px;
            word-break: break-all;
        }
        canvas.main {
            display: none;
        }
        .badge {
            display: inline-block;
            background: #e5e7eb;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: normal;
            color: #374151;
        }
    </style>
</head>
<body>

    <h1>📷 Escáner de Tickets Pro Max</h1>

    <div class="camera-container">
        <video id="video" autoplay playsinline></video>
        <div class="scan-guide"></div>
    </div>

    <div class="controls">
        <button id="btn-start">📷 Abrir Cámara</button>
        <button id="btn-scan" disabled>🔎 Escanear (Multi-OCR)</button>
    </div>

    <div id="status">
        <span>Presiona "Abrir Cámara" y coloca el ticket dentro del recuadro verde.</span>
        <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill"></div></div>
    </div>

    <div class="form-container">
        <div class="form-group">
            <label for="codigo">Código PRINCIPAL</label>
            <input class="codigo-box" type="text" id="codigo" placeholder="Ej: A2, A6, A15">
        </div>
        <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" placeholder="Nombre completo">
        </div>
        <div class="form-group">
            <label for="celular">Celular</label>
            <input type="text" id="celular" placeholder="71234567">
        </div>
        <div class="form-group">
            <label for="detalle">Detalle</label>
            <input type="text" id="detalle" placeholder="ELECTRONICOS">
        </div>
        <div class="form-group">
            <label for="fecha">Fecha y Hora</label>
            <input type="text" id="fecha" placeholder="09/07/2026 14:30">
        </div>
        <div class="form-group">
            <label for="extra">Tienda / Lugar</label>
            <input type="text" id="extra" placeholder="MEDIA LUNA">
        </div>
        <div class="resultado" id="resultado">
            El escaneo procesará ambas zonas unificadas con múltiples estrategias.
        </div>
    </div>

    <!-- Canvases ocultos para procesamiento -->
    <canvas class="main" id="canvas-foto"></canvas>
    <canvas class="main" id="canvas-unificado"></canvas>
    <canvas class="main" id="canvas-top"></canvas>
    <canvas class="main" id="canvas-top-reducido"></canvas>

    <!-- Debug -->
    <div class="debug-container" id="debug-container" style="display:none;">
        <div class="controls-debug">
            <button id="btn-toggle-debug">Mostrar imagen procesada</button>
            <button id="btn-download">Descargar imagen</button>
        </div>
        <canvas id="debug-canvas"></canvas>
        <div class="stats" id="stats"></div>
    </div>

    <script>
        // ============================================================
        // ELEMENTOS DOM
        // ============================================================
        const video = document.getElementById("video");
        const canvasFoto = document.getElementById("canvas-foto");
        const canvasUnificado = document.getElementById("canvas-unificado");
        const canvasTop = document.getElementById("canvas-top");
        const canvasTopReducido = document.getElementById("canvas-top-reducido");
        const debugCanvas = document.getElementById("debug-canvas");
        const btnStart = document.getElementById("btn-start");
        const btnScan = document.getElementById("btn-scan");
        const statusEl = document.getElementById("status");
        const progressFill = document.getElementById("progress-fill");
        const resultadoEl = document.getElementById("resultado");
        const statsEl = document.getElementById("stats");
        const debugContainer = document.getElementById("debug-container");
        const btnToggleDebug = document.getElementById("btn-toggle-debug");
        const btnDownload = document.getElementById("btn-download");
        let stream = null;
        let mostrarDebug = false;

        // ============================================================
        // CONTROL DE DEPURACIÓN
        // ============================================================
        btnToggleDebug.addEventListener("click", () => {
            mostrarDebug = !mostrarDebug;
            debugContainer.style.display = mostrarDebug ? "block" : "none";
            btnToggleDebug.textContent = mostrarDebug ? "Ocultar imagen procesada" : "Mostrar imagen procesada";
        });

        btnDownload.addEventListener("click", () => {
            if (debugCanvas.width > 0) {
                const link = document.createElement("a");
                link.download = "ticket_procesado.png";
                link.href = debugCanvas.toDataURL("image/png");
                link.click();
            }
        });

        // ============================================================
        // ABRIR CÁMARA
        // ============================================================
        btnStart.addEventListener("click", async () => {
            try {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: "environment" },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        focusMode: "continuous"
                    },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();
                btnScan.disabled = false;
                setStatus("✅ Cámara lista. Coloca el ticket y presiona 'Escanear (Multi-OCR)'.", "#dcfce7", "#166534");
            } catch (error) {
                console.error(error);
                setStatus("❌ No se pudo abrir la cámara. Revisa los permisos.", "#fee2e2", "#991b1b");
            }
        });

        // ============================================================
        // ESCANEAR CON MÚLTIPLES ESTRATEGIAS (MEJORADO PARA CÓDIGO GIGANTE)
        // ============================================================
        btnScan.addEventListener("click", async () => {
            if (!stream) return;
            if (!video.videoWidth || !video.videoHeight) {
                setStatus("⏳ Esperando la cámara...", "#fef3c7", "#92400e");
                return;
            }
            btnScan.disabled = true;
            setStatus("📸 Tomando foto...", "#fef3c7", "#92400e");
            progressFill.style.width = "0%";

            try {
                const vW = video.videoWidth;
                const vH = video.videoHeight;

                // ------------------------------------------------------------
                // PASO 1: CAPTURAR FOTO COMPLETA
                // ------------------------------------------------------------
                canvasFoto.width = vW;
                canvasFoto.height = vH;
                const ctxFoto = canvasFoto.getContext("2d", { willReadFrequently: true });
                ctxFoto.drawImage(video, 0, 0, vW, vH);

                // ------------------------------------------------------------
                // PASO 2: EXTRAER ZONA SUPERIOR (CÓDIGO GIGANTE)
                // ------------------------------------------------------------
                const alturaSuperior = Math.floor(vH * 0.35);
                canvasTop.width = vW;
                canvasTop.height = alturaSuperior;
                const ctxTop = canvasTop.getContext("2d", { willReadFrequently: true });
                ctxTop.drawImage(canvasFoto, 0, 0, vW, alturaSuperior, 0, 0, vW, alturaSuperior);

                // ------------------------------------------------------------
                // PASO 3: PROCESAR LA ZONA SUPERIOR CON MÚLTIPLES ESCALAS
                // ------------------------------------------------------------
                const escalas = [1.0, 0.7, 0.5, 0.3];
                let mejorCodigo = "";
                let mejorConfianza = 0;

                for (const escala of escalas) {
                    const anchoEscalado = Math.floor(vW * escala);
                    const altoEscalado = Math.floor(alturaSuperior * escala);
                    const canvasTemp = document.createElement("canvas");
                    canvasTemp.width = anchoEscalado;
                    canvasTemp.height = altoEscalado;
                    const ctxTemp = canvasTemp.getContext("2d");
                    ctxTemp.imageSmoothingEnabled = true;
                    ctxTemp.imageSmoothingQuality = "high";
                    ctxTemp.drawImage(canvasTop, 0, 0, vW, alturaSuperior, 0, 0, anchoEscalado, altoEscalado);

                    // Binarización simple (sin filtros agresivos)
                    const imgData = ctxTemp.getImageData(0, 0, anchoEscalado, altoEscalado);
                    const data = imgData.data;
                    for (let i = 0; i < data.length; i += 4) {
                        const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                        const val = gray > 140 ? 255 : 0;
                        data[i] = data[i + 1] = data[i + 2] = val;
                    }
                    ctxTemp.putImageData(imgData, 0, 0);

                    // OCR con SINGLE_WORD
                    const ocrResult = await Tesseract.recognize(
                        canvasTemp.toDataURL("image/png"),
                        "eng", {
                            tessedit_pageseg_mode: Tesseract.PSM.SINGLE_WORD,
                            tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
                        }
                    );
                    const texto = ocrResult.data.text.trim();
                    const confianza = ocrResult.data.confidence || 0;
                    console.log(`Escala ${escala}: "${texto}" (confianza: ${confianza})`);

                    // Intentar extraer un código válido
                    const codigoCandidato = extraerCodigo(texto);
                    if (codigoCandidato) {
                        // Si encontramos un código válido, lo guardamos y salimos
                        mejorCodigo = codigoCandidato;
                        break;
                    } else if (texto.length > 0 && confianza > mejorConfianza) {
                        // Si no, guardamos el texto con mayor confianza
                        mejorConfianza = confianza;
                        mejorCodigo = texto;
                    }
                }

                // Si no se encontró un código válido, intentar con una búsqueda más flexible
                if (!/^[A-Z]\d{1,3}$/.test(mejorCodigo)) {
                    // Intentar extraer de cualquier parte de la zona superior
                    const ocrTopGeneral = await Tesseract.recognize(
                        canvasTop.toDataURL("image/png"),
                        "eng", {
                            tessedit_pageseg_mode: Tesseract.PSM.SINGLE_BLOCK,
                            tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
                        }
                    );
                    const textoGeneral = ocrTopGeneral.data.text.trim();
                    const codigoExtra = extraerCodigo(textoGeneral);
                    if (codigoExtra) mejorCodigo = codigoExtra;
                }

                // ------------------------------------------------------------
                // PASO 4: PROCESAR LA ZONA INFERIOR (DATOS)
                // ------------------------------------------------------------
                const alturaInferior = vH - alturaSuperior;
                canvasUnificado.width = vW;
                canvasUnificado.height = alturaInferior;
                const ctxUnif = canvasUnificado.getContext("2d", { willReadFrequently: true });
                ctxUnif.drawImage(canvasFoto, 0, alturaSuperior, vW, alturaInferior, 0, 0, vW, alturaInferior);

                // Preprocesamiento ligero para la zona inferior
                const imgDataInf = ctxUnif.getImageData(0, 0, canvasUnificado.width, canvasUnificado.height);
                const dataInf = imgDataInf.data;
                for (let i = 0; i < dataInf.length; i += 4) {
                    const gray = 0.299 * dataInf[i] + 0.587 * dataInf[i + 1] + 0.114 * dataInf[i + 2];
                    const val = gray > 135 ? 255 : 0;
                    dataInf[i] = dataInf[i + 1] = dataInf[i + 2] = val;
                }
                ctxUnif.putImageData(imgDataInf, 0, 0);

                // OCR de la zona inferior
                const ocrInferior = await Tesseract.recognize(
                    canvasUnificado.toDataURL("image/jpeg", 0.95),
                    "spa+eng", {
                        logger: m => {
                            if (m.status === "recognizing text") {
                                const pct = 50 + Math.round(m.progress * 40);
                                actualizarProgreso(Math.min(pct, 90));
                            }
                        }
                    }
                );
                const textoInferior = ocrInferior.data.text;
                actualizarProgreso(95);

                // ------------------------------------------------------------
                // PASO 5: COMBINAR RESULTADOS
                // ------------------------------------------------------------
                const resultado = procesarResultados(textoInferior, mejorCodigo);

                // Asignar a inputs
                document.getElementById("codigo").value = resultado.codigo;
                document.getElementById("nombre").value = resultado.nombre;
                document.getElementById("celular").value = resultado.celular;
                document.getElementById("detalle").value = resultado.detalle;
                document.getElementById("fecha").value = resultado.fecha;
                document.getElementById("extra").value = resultado.extra;

                // Mostrar en el panel de resultado
                resultadoEl.innerHTML = `
                    <strong>✅ Resultado del escaneo:</strong><br>
                    📌 Código: <strong>${resultado.codigo || "No detectado"}</strong><br>
                    👤 Nombre: ${resultado.nombre || "No detectado"}<br>
                    📱 Celular: ${resultado.celular || "No detectado"}<br>
                    📦 Detalle: ${resultado.detalle || "No detectado"}<br>
                    📅 Fecha: ${resultado.fecha || "No detectada"}<br>
                    🏪 Tienda: ${resultado.extra || "No detectada"}
                `;

                statsEl.textContent = `Código detectado: "${mejorCodigo}" | Inferior: ${textoInferior.length} caracteres`;

                setStatus("✅ ¡Escaneo completado con éxito! (Multi-escala + OCR)", "#dcfce7", "#166534");
                progressFill.style.width = "100%";

            } catch (error) {
                console.error("❌ Error en escaneo:", error);
                setStatus("❌ Error al analizar la imagen. Intenta nuevamente.", "#fee2e2", "#991b1b");
            } finally {
                btnScan.disabled = false;
            }
        });

        // ============================================================
        // FUNCIÓN PARA EXTRAER CÓDIGO DE UN TEXTO OCR
        // ============================================================
        function extraerCodigo(texto) {
            // Limpiar texto
            const limpio = texto.replace(/[^A-Za-z0-9]/g, "").toUpperCase();
            // Buscar patrón: letra + 1-3 números
            const match = limpio.match(/^([A-Z])(\d{1,3})$/);
            if (match) {
                return match[1] + match[2];
            }
            // Buscar patrón en cualquier parte (si hay basura alrededor)
            const anyMatch = limpio.match(/([A-Z])(\d{1,3})/);
            if (anyMatch) {
                return anyMatch[1] + anyMatch[2];
            }
            return "";
        }

        // ============================================================
        // PROCESAR RESULTADOS DEL TEXTO INFERIOR
        // ============================================================
        function procesarResultados(textoInferior, codigoDetectado) {
            const texto = normalizarOCR(textoInferior);

            let celular = detectarCelular(texto);
            let fecha = detectarFecha(texto);
            let detalle = detectarCampo(texto, ["detalle", "producto", "descripcion", "descripción"]);
            let nombre = detectarNombre(texto, codigoDetectado, celular, fecha, detalle);
            let extra = detectarExtra(texto);

            return { codigo: codigoDetectado, nombre, celular, detalle, fecha, extra };
        }

        // ============================================================
        // FUNCIONES DE DETECCIÓN (copiadas de la versión anterior, mejoradas)
        // ============================================================

        function normalizarOCR(texto) {
            return texto
                .replace(/\r/g, "")
                .replace(/[|]/g, "I")
                .replace(/[“”"]/g, "")
                .replace(/[^\S\r\n]+/g, " ")
                .trim();
        }

        function detectarCelular(texto) {
            const match = texto.match(/(?:\+591\s*)?\b[6-9]\d{7}\b/g);
            if (match && match.length) {
                return match[0].replace(/\+591\s*/, "").trim();
            }
            const fallback = texto.match(/\b\d{8}\b/g);
            if (fallback && fallback.length) {
                return fallback[0];
            }
            return "";
        }

        function detectarFecha(texto) {
            const patrones = [
                /\b\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4}\s+\d{1,2}:\d{2}\b/,
                /\b\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4}\b/,
                /\b\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}\b/
            ];
            for (const patron of patrones) {
                const match = texto.match(patron);
                if (match) return match[0];
            }
            return "";
        }

        function detectarCampo(texto, etiquetas) {
            const lineas = texto.split("\n").map(l => l.trim()).filter(Boolean);
            for (const linea of lineas) {
                for (const etiqueta of etiquetas) {
                    const regex = new RegExp("^" + etiqueta + "\\s*[:\\-]?\\s*(.+)$", "i");
                    const match = linea.match(regex);
                    if (match) {
                        return limpiarTexto(match[1]);
                    }
                }
            }
            // Buscar en línea siguiente
            for (let i = 0; i < lineas.length - 1; i++) {
                for (const etiqueta of etiquetas) {
                    if (lineas[i].toLowerCase().includes(etiqueta.toLowerCase())) {
                        return limpiarTexto(lineas[i + 1]);
                    }
                }
            }
            return "";
        }

        function detectarNombre(texto, codigo, celular, fecha, detalle) {
            const lineas = texto.split("\n").map(l => limpiarTexto(l)).filter(Boolean);
            const descartadas = [
                "detalle", "producto", "descripcion", "nombre",
                "celular", "telefono", "fecha", "hora",
                "tienda", "lugar", "media luna", "código", "codigo",
                "total", "pago", "efectivo", "cambio", "gracias"
            ];

            for (const linea of lineas) {
                const upper = linea.toUpperCase();
                if (codigo && upper.includes(codigo.toUpperCase())) continue;
                if (celular && linea.includes(celular)) continue;
                if (fecha && linea.includes(fecha)) continue;
                if (detalle && upper.includes(detalle.toUpperCase())) continue;
                if (descartadas.some(palabra => upper === palabra.toUpperCase())) continue;

                const numeros = (linea.match(/\d/g) || []).length;
                if (numeros > linea.length / 2) continue;

                if (/^[A-Za-zÁÉÍÓÚáéíóúÑñÜü\s]+$/.test(linea) && linea.length >= 3) {
                    const prohibidos = ["ticket", "registro", "cliente", "datos", "total", "pago"];
                    if (prohibidos.some(palabra => upper.includes(palabra.toUpperCase()))) continue;
                    if (linea.split(/\s+/).length >= 2 || linea.length > 5) return linea;
                }
            }
            return "";
        }

        function detectarExtra(texto) {
            const lugares = ["MEDIA LUNA"];
            for (const lugar of lugares) {
                if (texto.toUpperCase().includes(lugar)) return lugar;
            }
            const campo = detectarCampo(texto, ["tienda", "lugar", "sucursal", "local"]);
            if (campo) return campo;

            const lineas = texto.split("\n").map(l => limpiarTexto(l)).filter(Boolean);
            for (let i = lineas.length - 1; i >= 0; i--) {
                const linea = lineas[i];
                if (/^[A-Za-zÁÉÍÓÚáéíóúÑñÜü\s]+$/.test(linea) && linea.length > 3) {
                    return linea;
                }
            }
            return "";
        }

        function limpiarTexto(texto) {
            return texto
                .replace(/^[^A-Za-zÁÉÍÓÚáéíóúÑñÜü0-9]+/, "")
                .replace(/[^A-Za-zÁÉÍÓÚáéíóúÑñÜü0-9\s:\/\-.]+$/g, "")
                .replace(/\s+/g, " ")
                .trim();
        }

        // ============================================================
        // FUNCIONES AUXILIARES
        // ============================================================

        function setStatus(mensaje, bg, color) {
            statusEl.innerHTML = `
                <span>${mensaje}</span>
                <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill"></div></div>
            `;
            statusEl.style.background = bg || "#fff7ed";
            statusEl.style.color = color || "#c2410c";
        }

        function actualizarProgreso(pct) {
            const fill = document.getElementById("progress-fill");
            if (fill) fill.style.width = Math.min(pct, 100) + "%";
        }
    </script>
</body>
</html>

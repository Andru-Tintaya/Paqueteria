<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner de Tickets Ultra+</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f3f4f6;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            font-size: 1.4rem;
            text-align: center;
            margin-bottom: 15px;
            color: #1f2937;
        }
        .camera-container {
            width: 100%;
            max-width: 430px;
            position: relative;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        .scan-guide {
            position: absolute;
            top: 5%;
            left: 7%;
            width: 86%;
            height: 90%;
            border: 3px solid #22c55e;
            border-radius: 10px;
            pointer-events: none;
        }
        .scan-guide::before {
            content: "COLOCA TODO EL TICKET DENTRO";
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            background: #16a34a;
            color: white;
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 10px;
            font-weight: bold;
            white-space: nowrap;
        }
        .scan-guide::after {
            content: "CÓDIGO GIGANTE ARRIBA";
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 9px;
            white-space: nowrap;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            width: 100%;
            max-width: 430px;
        }
        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 9px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            background: #2563eb;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        #btn-scan {
            background: #16a34a;
        }
        #btn-scan:active {
            transform: scale(0.97);
        }
        #status {
            width: 100%;
            max-width: 430px;
            min-height: 45px;
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
            background: #fff7ed;
            color: #c2410c;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 5px;
        }
        .progress-bar-fill {
            height: 100%;
            background: #16a34a;
            width: 0%;
            transition: width 0.3s;
        }
        .form-container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 4px;
            color: #374151;
        }
        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
        }
        .codigo-box {
            border: 2px solid #22c55e;
            background: #f0fdf4;
        }
        .resultado {
            margin-top: 12px;
            padding: 10px;
            border-radius: 8px;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 0.8rem;
            line-height: 1.5;
        }
        .debug-container {
            margin-top: 15px;
            width: 100%;
            max-width: 430px;
            border-radius: 8px;
            overflow: hidden;
            background: #1f2937;
            padding: 10px;
        }
        .debug-container canvas {
            width: 100%;
            border-radius: 4px;
            display: none;
        }
        .debug-container .controls-debug {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            justify-content: center;
        }
        .debug-container .controls-debug button {
            padding: 5px 12px;
            font-size: 0.7rem;
            background: #4b5563;
            flex: 0 1 auto;
        }
        .stats {
            font-size: 0.7rem;
            color: #9ca3af;
            text-align: center;
            margin-top: 8px;
            word-break: break-all;
        }
        canvas.main {
            display: none;
        }
        .badge {
            display: inline-block;
            background: #e5e7eb;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: normal;
            color: #374151;
        }
    </style>
</head>
<body>

    <h1>📷 Escáner de Tickets Ultra+</h1>

    <div class="camera-container">
        <video id="video" autoplay playsinline></video>
        <div class="scan-guide"></div>
    </div>

    <div class="controls">
        <button id="btn-start">📷 Abrir Cámara</button>
        <button id="btn-scan" disabled>🔎 Escanear (Multi-OCR)</button>
    </div>

    <div id="status">
        <span>Presiona "Abrir Cámara" y coloca el ticket dentro del recuadro verde.</span>
        <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill"></div></div>
    </div>

    <div class="form-container">
        <div class="form-group">
            <label for="codigo">Código PRINCIPAL</label>
            <input class="codigo-box" type="text" id="codigo" placeholder="Ej: A2, A6, A15">
        </div>
        <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" placeholder="Nombre completo">
        </div>
        <div class="form-group">
            <label for="celular">Celular</label>
            <input type="text" id="celular" placeholder="71234567">
        </div>
        <div class="form-group">
            <label for="detalle">Detalle</label>
            <input type="text" id="detalle" placeholder="ELECTRONICOS">
        </div>
        <div class="form-group">
            <label for="fecha">Fecha y Hora</label>
            <input type="text" id="fecha" placeholder="09/07/2026 14:30">
        </div>
        <div class="form-group">
            <label for="extra">Tienda / Lugar</label>
            <input type="text" id="extra" placeholder="MEDIA LUNA">
        </div>
        <div class="resultado" id="resultado">
            El escaneo procesará ambas zonas unificadas con múltiples estrategias.
        </div>
    </div>

    <!-- Canvases ocultos para procesamiento -->
    <canvas class="main" id="canvas-foto"></canvas>
    <canvas class="main" id="canvas-unificado"></canvas>
    <canvas class="main" id="canvas-top"></canvas>
    <canvas class="main" id="canvas-top-reducido"></canvas>

    <!-- Debug -->
    <div class="debug-container" id="debug-container" style="display:none;">
        <div class="controls-debug">
            <button id="btn-toggle-debug">Mostrar imagen procesada</button>
            <button id="btn-download">Descargar imagen</button>
        </div>
        <canvas id="debug-canvas"></canvas>
        <div class="stats" id="stats"></div>
    </div>

    <script>
        // ============================================================
        // ELEMENTOS DOM
        // ============================================================
        const video = document.getElementById("video");
        const canvasFoto = document.getElementById("canvas-foto");
        const canvasUnificado = document.getElementById("canvas-unificado");
        const canvasTop = document.getElementById("canvas-top");
        const canvasTopReducido = document.getElementById("canvas-top-reducido");
        const debugCanvas = document.getElementById("debug-canvas");
        const btnStart = document.getElementById("btn-start");
        const btnScan = document.getElementById("btn-scan");
        const statusEl = document.getElementById("status");
        const progressFill = document.getElementById("progress-fill");
        const resultadoEl = document.getElementById("resultado");
        const statsEl = document.getElementById("stats");
        const debugContainer = document.getElementById("debug-container");
        const btnToggleDebug = document.getElementById("btn-toggle-debug");
        const btnDownload = document.getElementById("btn-download");
        let stream = null;
        let mostrarDebug = false;

        // ============================================================
        // CONTROL DE DEPURACIÓN
        // ============================================================
        btnToggleDebug.addEventListener("click", () => {
            mostrarDebug = !mostrarDebug;
            debugContainer.style.display = mostrarDebug ? "block" : "none";
            btnToggleDebug.textContent = mostrarDebug ? "Ocultar imagen procesada" : "Mostrar imagen procesada";
        });

        btnDownload.addEventListener("click", () => {
            if (debugCanvas.width > 0) {
                const link = document.createElement("a");
                link.download = "ticket_procesado.png";
                link.href = debugCanvas.toDataURL("image/png");
                link.click();
            }
        });

        // ============================================================
        // ABRIR CÁMARA
        // ============================================================
        btnStart.addEventListener("click", async () => {
            try {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: "environment" },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        focusMode: "continuous"
                    },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();
                btnScan.disabled = false;
                setStatus("✅ Cámara lista. Coloca el ticket y presiona 'Escanear (Multi-OCR)'.", "#dcfce7", "#166534");
            } catch (error) {
                console.error(error);
                setStatus("❌ No se pudo abrir la cámara. Revisa los permisos.", "#fee2e2", "#991b1b");
            }
        });

        // ============================================================
        // ESCANEAR CON MÚLTIPLES ESTRATEGIAS (MEJORADO)
        // ============================================================
        btnScan.addEventListener("click", async () => {
            if (!stream) return;
            if (!video.videoWidth || !video.videoHeight) {
                setStatus("⏳ Esperando la cámara...", "#fef3c7", "#92400e");
                return;
            }
            btnScan.disabled = true;
            setStatus("📸 Tomando foto...", "#fef3c7", "#92400e");
            progressFill.style.width = "0%";

            try {
                const vW = video.videoWidth;
                const vH = video.videoHeight;

                // ------------------------------------------------------------
                // PASO 1: CAPTURAR FOTO COMPLETA
                // ------------------------------------------------------------
                canvasFoto.width = vW;
                canvasFoto.height = vH;
                const ctxFoto = canvasFoto.getContext("2d", { willReadFrequently: true });
                ctxFoto.drawImage(video, 0, 0, vW, vH);

                // ------------------------------------------------------------
                // PASO 2: DIVIDIR EN ZONAS (35% superior, 65% inferior)
                // ------------------------------------------------------------
                const alturaSuperior = Math.floor(vH * 0.35);
                const alturaInferior = vH - alturaSuperior;

                // ------------------------------------------------------------
                // PASO 3: PREPROCESAMIENTO AVANZADO DE LA ZONA SUPERIOR
                // ------------------------------------------------------------
                // 3a. Extraer zona superior original
                canvasTop.width = vW;
                canvasTop.height = alturaSuperior;
                const ctxTop = canvasTop.getContext("2d", { willReadFrequently: true });
                ctxTop.drawImage(canvasFoto, 0, 0, vW, alturaSuperior, 0, 0, vW, alturaSuperior);

                // 3b. Reducir drásticamente para normalizar tamaño de letra (factor 0.25)
                const factorReduccion = 0.25;
                const altoTopReducido = Math.floor(alturaSuperior * factorReduccion);
                const anchoTopReducido = vW;
                canvasTopReducido.width = anchoTopReducido;
                canvasTopReducido.height = altoTopReducido;
                const ctxTopRed = canvasTopReducido.getContext("2d");
                ctxTopRed.imageSmoothingEnabled = true;
                ctxTopRed.imageSmoothingQuality = "high";
                ctxTopRed.drawImage(canvasTop, 0, 0, vW, alturaSuperior, 0, 0, anchoTopReducido, altoTopReducido);

                // ------------------------------------------------------------
                // PASO 4: CREAR IMAGEN UNIFICADA (con texto de igual tamaño)
                // ------------------------------------------------------------
                const altoUnificado = altoTopReducido + alturaInferior;
                canvasUnificado.width = vW;
                canvasUnificado.height = altoUnificado;
                const ctxUnif = canvasUnificado.getContext("2d", { willReadFrequently: true });
                ctxUnif.fillStyle = "#FFFFFF";
                ctxUnif.fillRect(0, 0, canvasUnificado.width, canvasUnificado.height);
                ctxUnif.drawImage(canvasTopReducido, 0, 0);
                ctxUnif.drawImage(canvasFoto, 0, alturaSuperior, vW, alturaInferior, 0, altoTopReducido, vW, alturaInferior);

                // ------------------------------------------------------------
                // PASO 5: PREPROCESAMIENTO AVANZADO DE LA IMAGEN UNIFICADA
                // ------------------------------------------------------------
                // 5a. Aplicar filtro de mediana (reducción de ruido)
                aplicarFiltroMediana(canvasUnificado);
                // 5b. Ecualización de histograma (mejora de contraste)
                ecualizarHistograma(canvasUnificado);
                // 5c. Binarización adaptativa
                binarizarAdaptativo(canvasUnificado, 15, 10);

                // Mostrar en debug si está habilitado
                if (mostrarDebug) {
                    debugCanvas.width = canvasUnificado.width;
                    debugCanvas.height = canvasUnificado.height;
                    const ctxDebug = debugCanvas.getContext("2d");
                    ctxDebug.drawImage(canvasUnificado, 0, 0);
                }

                // ------------------------------------------------------------
                // PASO 6: MÚLTIPLES ESTRATEGIAS DE OCR
                // ------------------------------------------------------------
                setStatus("🔎 Escaneando con múltiples estrategias...", "#fef3c7", "#92400e");

                // 6a. OCR sobre la zona superior reducida (modo SINGLE_WORD)
                const ocrTopRed = await Tesseract.recognize(
                    canvasTopReducido.toDataURL("image/png"),
                    "eng", {
                        tessedit_pageseg_mode: Tesseract.PSM.SINGLE_WORD,
                        tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
                    }
                );
                const textoTopRed = ocrTopRed.data.text.trim();
                actualizarProgreso(30);

                // 6b. OCR sobre la zona superior original (modo SINGLE_LINE)
                const ocrTopOrig = await Tesseract.recognize(
                    canvasTop.toDataURL("image/png"),
                    "eng", {
                        tessedit_pageseg_mode: Tesseract.PSM.SINGLE_LINE,
                        tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
                    }
                );
                const textoTopOrig = ocrTopOrig.data.text.trim();
                actualizarProgreso(50);

                // 6c. OCR sobre la imagen unificada completa (español+inglés, SINGLE_BLOCK)
                const ocrUnif = await Tesseract.recognize(
                    canvasUnificado.toDataURL("image/jpeg", 0.95),
                    "spa+eng", {
                        tessedit_pageseg_mode: Tesseract.PSM.SINGLE_BLOCK,
                        logger: m => {
                            if (m.status === "recognizing text") {
                                const pct = 50 + Math.round(m.progress * 40);
                                actualizarProgreso(Math.min(pct, 90));
                            }
                        }
                    }
                );
                const textoUnif = ocrUnif.data.text;
                actualizarProgreso(90);

                // 6d. OCR sobre la unificada pero con PSM AUTO (modo por defecto)
                const ocrUnifAuto = await Tesseract.recognize(
                    canvasUnificado.toDataURL("image/jpeg", 0.95),
                    "spa+eng"
                );
                const textoUnifAuto = ocrUnifAuto.data.text;
                actualizarProgreso(95);

                // ------------------------------------------------------------
                // PASO 7: COMBINAR RESULTADOS (VOTACIÓN PARA EL CÓDIGO)
                // ------------------------------------------------------------
                const textosCombinados = [textoTopRed, textoTopOrig, textoUnif, textoUnifAuto].join("\n");
                console.log("📝 TOP REDUCIDO:", textoTopRed);
                console.log("📝 TOP ORIGINAL:", textoTopOrig);
                console.log("📝 UNIFICADO (SINGLE_BLOCK):", textoUnif);
                console.log("📝 UNIFICADO (AUTO):", textoUnifAuto);

                // ------------------------------------------------------------
                // PASO 8: PROCESAR RESULTADOS CON DETECCIÓN MEJORADA
                // ------------------------------------------------------------
                const resultado = procesarResultadosExtendido(textosCombinados, textoUnif, textoUnifAuto);

                // Asignar a inputs
                document.getElementById("codigo").value = resultado.codigo;
                document.getElementById("nombre").value = resultado.nombre;
                document.getElementById("celular").value = resultado.celular;
                document.getElementById("detalle").value = resultado.detalle;
                document.getElementById("fecha").value = resultado.fecha;
                document.getElementById("extra").value = resultado.extra;

                // Mostrar en el panel de resultado
                resultadoEl.innerHTML = `
                    <strong>✅ Resultado del escaneo:</strong><br>
                    📌 Código: <strong>${resultado.codigo || "No detectado"}</strong><br>
                    👤 Nombre: ${resultado.nombre || "No detectado"}<br>
                    📱 Celular: ${resultado.celular || "No detectado"}<br>
                    📦 Detalle: ${resultado.detalle || "No detectado"}<br>
                    📅 Fecha: ${resultado.fecha || "No detectada"}<br>
                    🏪 Tienda: ${resultado.extra || "No detectada"}
                `;

                // Estadísticas
                statsEl.textContent = `OCR1: "${textoTopRed}" | OCR2: "${textoTopOrig}" | OCR3: ${textoUnif.length} caracteres`;

                setStatus("✅ ¡Escaneo completado con éxito! (Multi-OCR + Preprocesamiento)", "#dcfce7", "#166534");
                progressFill.style.width = "100%";

            } catch (error) {
                console.error("❌ Error en escaneo:", error);
                setStatus("❌ Error al analizar la imagen. Intenta nuevamente.", "#fee2e2", "#991b1b");
            } finally {
                btnScan.disabled = false;
            }
        });

        // ============================================================
        // FUNCIONES DE PREPROCESAMIENTO AVANZADO
        // ============================================================

        // Filtro de mediana (3x3) para reducir ruido
        function aplicarFiltroMediana(canvas) {
            const ctx = canvas.getContext("2d", { willReadFrequently: true });
            const w = canvas.width,
                h = canvas.height;
            const imgData = ctx.getImageData(0, 0, w, h);
            const data = imgData.data;
            const output = new Uint8ClampedArray(data.length);
            const radius = 1;
            const size = (radius * 2 + 1) ** 2;

            for (let y = radius; y < h - radius; y++) {
                for (let x = radius; x < w - radius; x++) {
                    const idx = (y * w + x) * 4;
                    const values = [];
                    for (let dy = -radius; dy <= radius; dy++) {
                        for (let dx = -radius; dx <= radius; dx++) {
                            const ny = y + dy,
                                nx = x + dx;
                            const nIdx = (ny * w + nx) * 4;
                            values.push(data[nIdx]);
                        }
                    }
                    values.sort((a, b) => a - b);
                    const median = values[Math.floor(size / 2)];
                    output[idx] = output[idx + 1] = output[idx + 2] = median;
                    output[idx + 3] = data[idx + 3];
                }
            }
            // Copiar bordes
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const idx = (y * w + x) * 4;
                    if (output[idx] === undefined) {
                        output[idx] = data[idx];
                        output[idx + 1] = data[idx + 1];
                        output[idx + 2] = data[idx + 2];
                        output[idx + 3] = data[idx + 3];
                    }
                }
            }
            const newData = new ImageData(output, w, h);
            ctx.putImageData(newData, 0, 0);
        }

        // Ecualización de histograma (mejora de contraste)
        function ecualizarHistograma(canvas) {
            const ctx = canvas.getContext("2d", { willReadFrequently: true });
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            const hist = new Array(256).fill(0);
            // Calcular histograma en escala de grises
            for (let i = 0; i < data.length; i += 4) {
                const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                hist[Math.round(gray)]++;
            }
            // Acumular
            const total = data.length / 4;
            let acum = 0;
            const map = new Array(256);
            for (let i = 0; i < 256; i++) {
                acum += hist[i];
                map[i] = Math.round((acum / total) * 255);
            }
            // Aplicar mapeo
            for (let i = 0; i < data.length; i += 4) {
                const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                const newVal = map[Math.round(gray)];
                data[i] = data[i + 1] = data[i + 2] = newVal;
            }
            ctx.putImageData(imgData, 0, 0);
        }

        // Binarización adaptativa con umbral local
        function binarizarAdaptativo(canvas, blockSize = 15, constante = 10) {
            const ctx = canvas.getContext("2d", { willReadFrequently: true });
            const w = canvas.width,
                h = canvas.height;
            const imgData = ctx.getImageData(0, 0, w, h);
            const data = imgData.data;
            const output = new Uint8ClampedArray(data.length);
            const half = Math.floor(blockSize / 2);

            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const idx = (y * w + x) * 4;
                    // Calcular promedio local
                    let sum = 0,
                        count = 0;
                    for (let dy = -half; dy <= half; dy++) {
                        for (let dx = -half; dx <= half; dx++) {
                            const ny = y + dy,
                                nx = x + dx;
                            if (ny >= 0 && ny < h && nx >= 0 && nx < w) {
                                const nIdx = (ny * w + nx) * 4;
                                const gray = 0.299 * data[nIdx] + 0.587 * data[nIdx + 1] + 0.114 * data[nIdx + 2];
                                sum += gray;
                                count++;
                            }
                        }
                    }
                    const mean = sum / count;
                    const gray = 0.299 * data[idx] + 0.587 * data[idx + 1] + 0.114 * data[idx + 2];
                    const val = gray > (mean - constante) ? 255 : 0;
                    output[idx] = output[idx + 1] = output[idx + 2] = val;
                    output[idx + 3] = data[idx + 3];
                }
            }
            const newData = new ImageData(output, w, h);
            ctx.putImageData(newData, 0, 0);
        }

        // ============================================================
        // FUNCIONES DE PROCESAMIENTO DE RESULTADOS (MEJORADAS)
        // ============================================================

        function procesarResultadosExtendido(textoCombinado, textoUnif, textoUnifAuto) {
            const normalizado = normalizarOCR(textoCombinado);

            // 1. DETECTAR CÓDIGO CON VOTACIÓN
            let codigo = detectarCodigoVotacion(textoTopRed, textoTopOrig, textoUnif, textoUnifAuto);

            // Si no se detectó, intentar con el combinado
            if (!codigo) {
                codigo = detectarCodigoAvanzado(normalizado);
            }

            // 2. DETECTAR CELULAR
            let celular = detectarCelular(textoUnif);
            if (!celular) celular = detectarCelular(textoUnifAuto);
            if (!celular) celular = detectarCelular(textoCombinado);

            // 3. DETECTAR FECHA
            let fecha = detectarFecha(textoUnif);
            if (!fecha) fecha = detectarFecha(textoUnifAuto);
            if (!fecha) fecha = detectarFecha(textoCombinado);

            // 4. DETECTAR DETALLE
            let detalle = detectarCampo(textoUnif, ["detalle", "producto", "descripcion", "descripción"]);
            if (!detalle) detalle = detectarCampo(textoUnifAuto, ["detalle", "producto", "descripcion", "descripción"]);
            if (!detalle) detalle = detectarCampo(textoCombinado, ["detalle", "producto", "descripcion", "descripción"]);

            // 5. DETECTAR NOMBRE
            let nombre = detectarNombre(textoUnif, codigo, celular, fecha, detalle);
            if (!nombre) nombre = detectarNombre(textoUnifAuto, codigo, celular, fecha, detalle);
            if (!nombre) nombre = detectarNombre(textoCombinado, codigo, celular, fecha, detalle);

            // 6. DETECTAR TIENDA
            let extra = detectarExtra(textoUnif);
            if (!extra) extra = detectarExtra(textoUnifAuto);
            if (!extra) extra = detectarExtra(textoCombinado);

            return { codigo, nombre, celular, detalle, fecha, extra };
        }

        // ============================================================
        // DETECCIÓN DE CÓDIGO CON VOTACIÓN
        // ============================================================
        function detectarCodigoVotacion(...textos) {
            const candidatos = [];
            for (const txt of textos) {
                if (!txt) continue;
                const cod = detectarCodigoAvanzado(txt);
                if (cod) candidatos.push(cod);
            }
            if (candidatos.length === 0) return "";
            const conteo = {};
            for (const c of candidatos) {
                conteo[c] = (conteo[c] || 0) + 1;
            }
            let max = 0,
                ganador = candidatos[0];
            for (const [key, val] of Object.entries(conteo)) {
                if (val > max) { max = val;
                    ganador = key; }
            }
            return ganador;
        }

        // ============================================================
        // FUNCIONES DE DETECCIÓN AVANZADAS
        // ============================================================

        function normalizarOCR(texto) {
            return texto
                .replace(/\r/g, "")
                .replace(/[|]/g, "I")
                .replace(/[“”"]/g, "")
                .replace(/[^\S\r\n]+/g, " ")
                .trim();
        }

        function detectarCodigoAvanzado(texto) {
            // Diccionario masivo de correcciones OCR
            const correcciones = {
                'G': '6', 'Z': '2', 'S': '5', 'O': '0',
                'I': '1', 'L': '1', 'B': '8', 'Q': '0',
                'D': '0', 'P': '9', 'R': '2', 'T': '7',
                'Y': '4', 'A': '4', 'E': '3', 'H': '4',
                'K': '1', 'M': '1', 'N': '1', 'V': '1'
            };

            // 1. Patrón clásico: letra + 1-3 números
            let match = texto.match(/\b([A-Z])\s*[-.]?\s*(\d{1,3})\b/gi);
            if (match && match.length) {
                for (const candidato of match) {
                    const limpio = candidato.replace(/[\s\-\.]/g, "").toUpperCase();
                    if (/^[A-Z]\d{1,3}$/.test(limpio)) {
                        return limpio;
                    }
                }
            }

            // 2. Buscar en líneas con posibles confusiones
            const lineas = texto.split("\n").map(l => l.trim()).filter(Boolean);
            for (const linea of lineas) {
                let limpia = linea.replace(/[^A-Za-z0-9]/g, "").toUpperCase();
                if (/^[A-Z][A-Z0-9]{1,3}$/.test(limpia)) {
                    const prefijo = limpia.charAt(0);
                    let numeros = "";
                    for (let char of limpia.substring(1)) {
                        numeros += correcciones[char] || char;
                    }
                    const codigoFinal = prefijo + numeros;
                    if (/^[A-Z]\d{1,3}$/.test(codigoFinal)) {
                        return codigoFinal;
                    }
                }
                // Caso especial: "A 6" separado
                const parts = linea.match(/^([A-Z])\s*(\d{1,3})$/i);
                if (parts) {
                    return (parts[1] + parts[2]).toUpperCase();
                }
            }

            // 3. Búsqueda global
            const anyMatch = texto.match(/([A-Z])\s*(\d{1,3})/i);
            if (anyMatch) {
                return (anyMatch[1] + anyMatch[2]).toUpperCase();
            }
            return "";
        }

        function detectarCelular(texto) {
            // Bolivia: 7 u 8 dígitos, empieza con 6,7,8,9
            const match = texto.match(/(?:\+591\s*)?\b[6-9]\d{7}\b/g);
            if (match && match.length) {
                return match[0].replace(/\+591\s*/, "").trim();
            }
            const fallback = texto.match(/\b\d{8}\b/g);
            if (fallback && fallback.length) {
                return fallback[0];
            }
            return "";
        }

        function detectarFecha(texto) {
            const patrones = [
                /\b\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4}\s+\d{1,2}:\d{2}\b/,
                /\b\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4}\b/,
                /\b\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}\b/,
                /\b\d{2}[-]\d{2}[-]\d{4}\b/
            ];
            for (const patron of patrones) {
                const match = texto.match(patron);
                if (match) return match[0];
            }
            return "";
        }

        function detectarCampo(texto, etiquetas) {
            const lineas = texto.split("\n").map(l => l.trim()).filter(Boolean);
            for (const linea of lineas) {
                for (const etiqueta of etiquetas) {
                    const regex = new RegExp("^" + etiqueta + "\\s*[:\\-]?\\s*(.+)$", "i");
                    const match = linea.match(regex);
                    if (match) {
                        return limpiarTexto(match[1]);
                    }
                }
            }
            // Buscar en línea siguiente
            for (let i = 0; i < lineas.length - 1; i++) {
                for (const etiqueta of etiquetas) {
                    if (lineas[i].toLowerCase().includes(etiqueta.toLowerCase())) {
                        return limpiarTexto(lineas[i + 1]);
                    }
                }
            }
            return "";
        }

        function detectarNombre(texto, codigo, celular, fecha, detalle) {
            const lineas = texto.split("\n").map(l => limpiarTexto(l)).filter(Boolean);
            const descartadas = [
                "detalle", "producto", "descripcion", "nombre",
                "celular", "telefono", "fecha", "hora",
                "tienda", "lugar", "media luna", "código", "codigo",
                "total", "pago", "efectivo", "cambio", "gracias"
            ];

            for (const linea of lineas) {
                const upper = linea.toUpperCase();
                if (codigo && upper.includes(codigo.toUpperCase())) continue;
                if (celular && linea.includes(celular)) continue;
                if (fecha && linea.includes(fecha)) continue;
                if (detalle && upper.includes(detalle.toUpperCase())) continue;
                if (descartadas.some(palabra => upper === palabra.toUpperCase())) continue;

                const numeros = (linea.match(/\d/g) || []).length;
                if (numeros > linea.length / 2) continue;

                if (/^[A-Za-zÁÉÍÓÚáéíóúÑñÜü\s]+$/.test(linea) && linea.length >= 3) {
                    const prohibidos = ["ticket", "registro", "cliente", "datos", "total", "pago"];
                    if (prohibidos.some(palabra => upper.includes(palabra.toUpperCase()))) continue;
                    // Si contiene dos palabras separadas, es buena señal
                    if (linea.split(/\s+/).length >= 2) return linea;
                    // Si es una sola palabra larga (>5), también puede ser nombre
                    if (linea.length > 5) return linea;
                }
            }
            return "";
        }

        function detectarExtra(texto) {
            // Buscar palabras clave de tienda
            const lugares = ["MEDIA LUNA", "MEDIA LUNA"];
            for (const lugar of lugares) {
                if (texto.toUpperCase().includes(lugar)) return lugar;
            }
            // Buscar campo tienda/lugar
            const campo = detectarCampo(texto, ["tienda", "lugar", "sucursal", "local"]);
            if (campo) return campo;

            // Última línea con solo letras y longitud > 3
            const lineas = texto.split("\n").map(l => limpiarTexto(l)).filter(Boolean);
            for (let i = lineas.length - 1; i >= 0; i--) {
                const linea = lineas[i];
                if (/^[A-Za-zÁÉÍÓÚáéíóúÑñÜü\s]+$/.test(linea) && linea.length > 3) {
                    return linea;
                }
            }
            return "";
        }

        function limpiarTexto(texto) {
            return texto
                .replace(/^[^A-Za-zÁÉÍÓÚáéíóúÑñÜü0-9]+/, "")
                .replace(/[^A-Za-zÁÉÍÓÚáéíóúÑñÜü0-9\s:\/\-.]+$/g, "")
                .replace(/\s+/g, " ")
                .trim();
        }

        // ============================================================
        // FUNCIONES AUXILIARES
        // ============================================================

        function setStatus(mensaje, bg, color) {
            // Mantener la estructura con el progress bar
            statusEl.innerHTML = `
                <span>${mensaje}</span>
                <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill"></div></div>
            `;
            statusEl.style.background = bg || "#fff7ed";
            statusEl.style.color = color || "#c2410c";
        }

        function actualizarProgreso(pct) {
            const fill = document.getElementById("progress-fill");
            if (fill) fill.style.width = Math.min(pct, 100) + "%";
        }

        // Nota: las variables textoTopRed y textoTopOrig se usan en procesarResultadosExtendido,
        // pero están definidas dentro del evento click. Para que funcionen, las pasamos como parámetros.
        // Para simplificar, las declaramos globalmente (aunque no sea necesario).
        let textoTopRed = "";
        let textoTopOrig = "";
    </script>
